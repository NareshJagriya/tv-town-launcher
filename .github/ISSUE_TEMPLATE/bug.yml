name: Something isn't working
description: Tell us what went wrong, so it can be fixed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A photo of the TV screen helps.
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: Your TV or box
      placeholder: e.g. Philips 43PUT7906, Android 11, 1.5 GB
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TV Town version
      description: Settings → About
      placeholder: "1.0"
  - type: textarea
    id: more
    attributes:
      label: Anything else?
